<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Дорожные знаки</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <style>
        .tooltip { position: relative; }
        .tooltip .ui-tooltip {
            position: absolute;
            background-color: #fff;
            border: 1px solid #ddd;
            padding: 5px;
            z-index: 1;
        }
        img { width: 100px; margin: 10px; }
    </style>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <script>
        $(function () {
            $(document).tooltip({
                items: "img",
                content: function () {
                    var $element = $(this);
                    if ($element.is("img")) {
                        return $element.data('hint');
                    }
                }
            });
        });
    </script>
</head>
<body>
    <p>
        <img src="img/signs/sign1.png" class="tooltip" data-hint="Выезд на набережную">
        <img src="img/signs/sign2.png" class="tooltip" data-hint="Скользкая дорога">
        <img src="img/signs/sign3.png" class="tooltip" data-hint="Двустороннее движение">
        <img src="img/signs/sign4.png" class="tooltip" data-hint="Дикие животные">
        <img src="img/signs/sign5.png" class="tooltip" data-hint="Боковой ветер">
    </p>
    <p>
        <img src="img/signs/sign6.png" class="tooltip" data-hint="Главная дорога">
        <img src="img/signs/sign7.png" class="tooltip" data-hint="Пересечение со второстепенной">
        <img src="img/signs/sign8.png" class="tooltip" data-hint="Движение без остановки запрещено">
        <img src="img/signs/sign9.png" class="tooltip" data-hint="Преимущество встречного движения">
        <img src="img/signs/sign10.png" class="tooltip" data-hint="Преимущество перед встречным">
    </p>
    <p>
        <img src="img/signs/sign11.png" class="tooltip" data-hint="Движение грузовиков запрещено">
        <img src="img/signs/sign12.png" class="tooltip" data-hint="Движение с прицепом запрещено">
        <img src="img/signs/sign13.png" class="tooltip" data-hint="Движение пешеходов запрещено">
        <img src="img/signs/sign14.png" class="tooltip" data-hint="Ограничение высоты">
        <img src="img/signs/sign15.png" class="tooltip" data-hint="Разворот запрещен">
    </p>
</body>
</html>
